---
layout: default
title: Beranda
---
<section class="app-grid">
  <h2>Daftar Aplikasi</h2>
  <div class="grid-container">
    {% for app in site.apps %}
      <div class="app-card">
        <h3>{{ app.title }}</h3>
        <p>{{ app.description | strip_html | truncate: 100 }}</p>
        <!-- Navigasi langsung ke URL postingan /app/judul -->
        <a href="{{ app.url | relative_url }}" class="btn-link">Buka Aplikasi</a>
      </div>
    {% endfor %}
  </div>
</section>

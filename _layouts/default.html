<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: page.name | default: site.title }}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        }
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased selection:bg-emerald-500 selection:text-white min-h-screen flex flex-col justify-between overflow-x-hidden">

    <!-- Announcement Bar -->
    <div class="bg-gradient-to-r from-emerald-600 via-teal-600 to-indigo-600 text-white text-xs font-semibold py-2.5 px-4 text-center tracking-wide shadow-sm relative z-50">
        <div class="max-w-7xl mx-auto flex items-center justify-center gap-2">
            <span class="bg-white/20 text-white text-[10px] uppercase font-extrabold px-2 py-0.5 rounded-full backdrop-blur-md">Update</span>
            <span>Ekosistem aplikasi Andtree kini mendukung integrasi Android 15 & Enterprise Security v4.</span>
        </div>
    </div>

    <!-- Header / Navbar Enterprise -->
    <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-slate-200/80 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-18 sm:h-20 flex items-center justify-between gap-4">
            <a href="{{ '/' | relative_url }}" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-600 flex items-center justify-center text-white shadow-md shadow-emerald-500/20">
                    <i data-lucide="layers" class="w-6 h-6"></i>
                </div>
                <div class="flex flex-col">
                    <span class="text-xl font-extrabold tracking-tight text-slate-900 leading-none">Andtree<span class="text-emerald-500">.</span></span>
                    <span class="text-[10px] font-bold tracking-widest uppercase text-slate-400 mt-1">Enterprise Platform</span>
                </div>
            </a>
            
            <div class="flex items-center gap-3">
                <a href="{{ '/' | relative_url }}#faq" class="hidden sm:inline-flex text-xs font-bold text-slate-600 hover:text-emerald-600 transition-colors px-3 py-2">FAQ</a>
                <a href="{{ '/' | relative_url }}#support" class="hidden sm:inline-flex text-xs font-bold text-slate-600 hover:text-emerald-600 transition-colors px-3 py-2">Dukungan</a>
                <a href="{{ '/' | relative_url }}#apps" class="inline-flex items-center gap-2 bg-slate-900 hover:bg-emerald-600 text-white font-bold px-4 py-2.5 rounded-xl transition-all shadow-md text-xs sm:text-sm">
                    <i data-lucide="smartphone" class="w-4 h-4 text-emerald-400"></i>
                    <span>Eksplor Aplikasi</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow">
        {{ content }}
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 border-t border-slate-800 py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 flex flex-col md:flex-row items-center justify-between gap-6">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-emerald-500 flex items-center justify-center text-slate-950 font-bold">
                    <i data-lucide="layers" class="w-5 h-5 text-white"></i>
                </div>
                <span class="font-bold text-white text-base tracking-tight">Andtree Software Ltd.</span>
            </div>
            <p class="text-xs text-center md:text-left text-slate-500">
                &copy; {{ site.time | date: "%Y" }} Andtree Enterprise Ecosystem. Hak Cipta Dilindungi Undang-Undang.
            </p>
        </div>
    </footer>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>

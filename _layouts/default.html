<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#0B0F17] text-slate-300 font-sans antialiased selection:bg-emerald-500 selection:text-white min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-[#0B0F17]/80 backdrop-blur-md border-b border-slate-800/80">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="{{ '/' | relative_url }}" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center text-white shadow-lg shadow-emerald-500/20">
                    <i data-lucide="layers" class="w-6 h-6"></i>
                </div>
                <span class="text-xl font-bold tracking-tight text-white">Andtree<span class="text-emerald-500">.</span></span>
            </a>
            <div class="flex items-center gap-4">
                <a href="#apps" class="inline-flex items-center gap-2 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-semibold px-5 py-2.5 rounded-xl transition-all shadow-md shadow-emerald-500/20 text-sm">
                    <i data-lucide="smartphone" class="w-4 h-4"></i> Aplikasi Android
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="pt-28 pb-20 flex-grow">
        {{ content }}
    </main>

    <!-- Footer -->
    <footer class="bg-slate-950 border-t border-slate-800/80 py-8">
        <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-4 text-sm">
            <div class="flex items-center gap-3">
                <div class="w-7 h-7 rounded-lg bg-emerald-500 flex items-center justify-center text-slate-950">
                    <i data-lucide="layers" class="w-4 h-4"></i>
                </div>
                <span class="font-bold text-white">Andtree Inc.</span>
            </div>
            <p class="text-slate-500 text-xs text-center md:text-left">
                &copy; {{ site.time | date: "%Y" }} Andtree Software Ltd. All rights reserved.
            </p>
        </div>
    </footer>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
